<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Entry Stand - UP3 Surabaya Utara</title>
    <style>
                :root {
            --primary: #00A2B9;          /* Biru Toska Korporat (Pantone 3135 C) */
            --primary-hover: #008699;    /* Toska lebih gelap saat disentuh */
            --bg-main: #035B71;          /* Biru Tua Korporat Utama (Pantone 7477 C) */
            --bg-card: #024455;          /* Biru Tua Kartu Dashboard */
            --text-main: #ffffff;        /* Putih bersih */
            --text-muted: #bae6fd;       /* Biru muda lembut untuk subjudul */
            --border: #0a788f;           /* Garis batas nuansa korporat */
            --input-bg: #023644;         /* Kotak input gelap agar angka jelas */
            --success: #00A2B9;          /* Tombol Simpan menggunakan Toska Korporat */
            --success-hover: #008699;
            --danger: #FF0000;           /* Merah Resmi PLN (#FF0000) */
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); padding: 20px 15px; display: flex; justify-content: center; }
        .container { background-color: var(--bg-card); padding: 30px 25px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); width: 100%; max-width: 1200px; position: relative; }
        
        .header-section { text-align: left; margin-bottom: 25px; border-bottom: 1px solid var(--border); padding-bottom: 20px; padding-top: 5px; }
        h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.025em; }
        p.subtitle { color: var(--text-muted); font-size: 14px; }
        
        /* MODERN TAB NAVIGATION */
        .tab-navigation { display: flex; background-color: rgba(2, 54, 68, 0.7); padding: 6px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 30px; gap: 5px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 6px; background: none; color: var(--text-muted); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; text-align: center; }
        .tab-btn:hover { color: var(--text-main); background-color: rgba(51, 65, 85, 0.3); }
        .tab-btn.active { background-color: var(--primary); color: white; box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2); }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* FORM STYLE COMPONENTS */
        .filter-section { background-color: rgba(2, 54, 68, 0.7); padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 20px; }
        .filter-group { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 200px; }
        .filter-group label { font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.05em; }
        .select-custom { padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; background-color: var(--input-bg); color: var(--text-main); font-weight: 600; cursor: pointer; }
        .select-custom:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); }
        .table-wrapper { overflow-x: auto; margin-bottom: 30px; border-radius: 12px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 850px; }
        th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background-color: #1e293b; color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; }
        tbody tr:hover { background-color: rgba(51, 65, 85, 0.3); }
        td b { color: #f1f5f9; }
        
        .input-num { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; text-align: right; outline: none; background-color: var(--input-bg); color: var(--text-main); -moz-appearance: textfield; }
        .input-num:focus { border-color: var(--primary); background-color: rgba(15, 23, 42, 0.8); }
        .input-num::-webkit-outer-spin-button, .input-num::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .btn-container { text-align: right; }
        .btn-submit { padding: 14px 40px; background-color: var(--success); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; width: 100%; max-width: 280px; }
        .btn-submit:hover { background-color: var(--success-hover); }

        /* MONITORING DASHBOARD COMPONENTS */
        .progress-card { background: rgba(15, 23, 42, 0.4); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 30px; text-align: center; }
        .progress-text { font-size: 16px; font-weight: 600; margin-bottom: 10px; color: #f1f5f9; }
        .progress-bar-container { background-color: #334155; border-radius: 20px; height: 20px; width: 100%; overflow: hidden; }
        .progress-bar-fill { background: linear-gradient(90deg, #10b981, #34d399); height: 100%; width: 0%; transition: width 0.5s ease-in-out; }
        .gi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .gi-card { border: 1px solid var(--border); padding: 18px 15px; border-radius: 10px; background-color: rgba(15, 23, 42, 0.2); display: flex; flex-direction: column; gap: 8px; transition: transform 0.2s; }
        .gi-card:hover { transform: translateY(-2px); }
        .gi-name { font-size: 14px; font-weight: 700; color: #f1f5f9; }
        .status-badge { padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; text-align: center; text-transform: uppercase; letter-spacing: 0.05em; align-self: flex-start; }
        .status-done { background-color: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-wait { background-color: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); }
        .loading-text { text-align: center; font-size: 16px; color: var(--text-muted); padding: 40px 0; }
        
        @media (max-width: 768px) { 
            .container { padding-top: 100px; } 
            .logo-pln { left: 50%; transform: translateX(-50%); top: 20px; height: 60px; }
            .filter-section { flex-direction: column; } 
            .filter-group, .btn-submit { max-width: 100%; }
            .tab-btn { padding: 10px; font-size: 13px; }
            .gi-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header-section">
        <h2>PORTAL ENTRY STAND GI PENYULANG</h2>
        <p class="subtitle">Sistem Entri Stand Penyaluran & Monitoring GI UP3 Surabaya Utara</p>
    </div>

    <!-- TAB SWITCHER NAVIGATION -->
    <div class="tab-navigation">
        <button class="tab-btn active" onclick="switchTab('inputTab')">📝 Input Stand</button>
        <button class="tab-btn" onclick="switchTab('monitorTab')">📊 Monitoring Status Entry</button>
    </div>

    <!-- TAB 1: FORM INPUT DATA -->
    <div id="inputTab" class="tab-content active">
        <div class="filter-section">
            <div class="filter-group">
                <label>Pilih Gardu Induk (GI)</label>
                <select id="giSelect" class="select-custom"></select>
            </div>
            <div class="filter-group">
                <label>Pilih Trafo</label>
                <select id="trafoSelect" class="select-custom"></select>
            </div>
        </div>
        <form id="matrixForm">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Nama Penyulang</th>
                            <th style="width: 125px;">LWBP 1</th>
                            <th style="width: 125px;">LWBP 2</th>
                            <th style="width: 125px;">WBP</th>
                            <th style="width: 135px;">Total</th>
                            <th style="width: 125px;">kVArH</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div class="btn-container">
                <button type="submit" id="submitBtn" class="btn-submit">Simpan Data</button>
            </div>
        </form>
    </div>

    <!-- TAB 2: MONITORING DASHBOARD -->
    <div id="monitorTab" class="tab-content">
        <div class="progress-card">
            <div class="progress-text" id="progressLabel">Menghubungkan ke database...</div>
            <div class="progress-bar-container"><div class="progress-bar-fill" id="progressBar"></div></div>
        </div>
        <div id="loadingMonitor" class="loading-text">Memproses status sinkronisasi harian...</div>
        <div class="gi-grid" id="giGrid"></div>
    </div>
</div>

        },
        "SAMBIKEREP": {
            "I": ["Meter Utama", "Meter Pembanding", "PS", "Casablanca", "Klakarejo", "Sememi", "Rd Padangan", "Adelaide", "Sambalan"],
            "II": ["Meter Utama", "Meter Pembanding", "PS", "Victoria", "Kendung", "Bringin", "Alas Malang", "Moroseneng", "North West"]
        },
        "PT INDOFOOD": { "I": ["PT Indofood"] },
        "KALISARI": { "I": ["Meter Utama", "Meter Pembanding", "PS", "Ir Soekarno", "Arkadia", "Nakamura", "Pantai Timur", "Riverside", "Gading Pantai", "Kenpark", "S Galaxy 1", "Elgrand", "S Galaxy 2", "Persia", "Pakuwon City 1", "Pakuwon City 2"] },
        "KEDINDING": { "I": ["Meter Utama", "Meter Pembanding", "PS", "M Noer", "Al Fitrah", "Nambangan", "Grand Sagara", "Kalilom", "East Coast", "Surabaya Park"] },
        "SUKOLILO": {
            "III": ["Meter Utama", "Meter Pembanding", "PS", "Semolo", "Kalidami", "Gebang Lor", "Srikana", "Lotus", "PAM", "Bratang Kalisumo", "Bengkel", "Megah Raya", "Kali Rungkut", "Atlas", "Tropical"],
            "IV": ["Meter Utama", "Meter Pembanding", "PS", "Bima 1", "Bima 2", "Klampis", "Kertajaya"]
        },
        "GEMBONG": { "I": ["Meter Utama", "Meter Pembanding", "PS", "Simokerto", "Kapasan", "Mega Grosir", "Alimar", "Arabica", "Soewandi"] },
        "WONOKROMO": { "III": ["Meter Utama", "Meter Pembanding", "PS", "Prapen", "Univ Hang Tuah", "Exp Wonokromo 1 (Marga Satwa)", "Exp Wonokromo 2 (Ciwo 2)", "Exp Wonokromo 3 (Indragiri)", "PAM 4", "Joyoboyo", "Kejaksaan", "Adityawarman", "Royal 1", "Ketintang", "Petrokimia", "Mangga Dua", "PAM 3"] }
    };
    const giSelect = document.getElementById('giSelect');
    const trafoSelect = document.getElementById('trafoSelect');
    const tbody = document.getElementById('tableBody');
    const gridContainer = document.getElementById('giGrid');
    const loadingMonitor = document.getElementById('loadingMonitor');
    const progressBar = document.getElementById('progressBar');
    const progressLabel = document.getElementById('progressLabel');

    // ⚠️ MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzd-7rTeTsBSFDBqFTKeAvS-lFN1Ckx7KM3ug3oPe58RerpXb8NlFwDpNW6i_3LTDusIQ/exec';

    // NAVIGASI PERPINDAHAN TAB ENGINE
    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        if (tabId === 'inputTab') {
            document.querySelector('[onclick="switchTab(\'inputTab\')"]').classList.add('active');
            document.getElementById('inputTab').classList.add('active');
        } else {
            document.querySelector('[onclick="switchTab(\'monitorTab\')"]').classList.add('active');
            document.getElementById('monitorTab').classList.add('active');
            muatHalamanMonitoring(); // Auto fetch data saat tab dashboard diklik
        }
    }

    // TAB 1: LOGIK FORM INPUT GENERATOR
    Object.keys(dbSistem).forEach(giName => {
        const opt = document.createElement('option');
        opt.value = giName; opt.textContent = giName;
        giSelect.appendChild(opt);
    });

    function updateTrafoOptions() {
        trafoSelect.innerHTML = "";
        const selectedGI = giSelect.value;
        Object.keys(dbSistem[selectedGI]).forEach(tId => {
            const opt = document.createElement('option');
            opt.value = tId; opt.textContent = `TRAFO ${tId}`;
            trafoSelect.appendChild(opt);
        });
        renderTable();
    }

    function renderTable() {
        tbody.innerHTML = "";
        const currentGI = giSelect.value;
        const currentTrafo = trafoSelect.value;
        if (!currentGI || !currentTrafo) return;

        dbSistem[currentGI][currentTrafo].forEach(pName => {
            const tr = document.createElement('tr');
            tr.setAttribute('data-pname', pName);
            tr.innerHTML = `
                <td><b>${pName}</b></td>
                <td><input type="number" step="any" class="input-num lwbp1" min="0" placeholder="0"></td>
                <td><input type="number" step="any" class="input-num lwbp2" min="0" placeholder="0"></td>
                <td><input type="number" step="any" class="input-num wbp" min="0" placeholder="0"></td>
                <td><input type="number" step="any" class="input-num total" min="0" placeholder="0"></td>
                <td><input type="number" step="any" class="input-num kvarh" min="0" placeholder="0"></td>
            `;
            tbody.appendChild(tr);
        });
    }

    giSelect.addEventListener('change', updateTrafoOptions);
    trafoSelect.addEventListener('change', renderTable);
    updateTrafoOptions();

    // SINKRONISASI TOMBOL SIMPAN KE GOOGLE SHEETS
    const form = document.getElementById('matrixForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', e => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Menyimpan...';

        const giVal = giSelect.value;
        const trafoVal = `TRAFO ${trafoSelect.value}`;
        const rowsData = [];
        let isValid = true;
        let namaPenyulangEror = "";

        tbody.querySelectorAll('tr').forEach(tr => {
            const pName = tr.getAttribute('data-pname');
            const lwbp1 = tr.querySelector('.lwbp1').value;
            const lwbp2 = tr.querySelector('.lwbp2').value;
            const wbp = tr.querySelector('.wbp').value;
            const total = tr.querySelector('.total').value;
            const kvarh = tr.querySelector('.kvarh').value;

            if (lwbp1.trim() === "" && lwbp2.trim() === "" && wbp.trim() === "" && total.trim() === "" && kvarh.trim() === "") return;

            const validasiAngkaKetat = (val) => {
                if (val.trim() === "") return "";
                return /^\d+(\.\d+)?$/.test(val.trim()) ? val.trim() : false;
            };

            const fLwbp1 = validasiAngkaKetat(lwbp1);
            const fLwbp2 = validasiAngkaKetat(lwbp2);
            const fWbp = validasiAngkaKetat(wbp);
            const fTotal = validasiAngkaKetat(total);
            const fKvarh = validasiAngkaKetat(kvarh);

            if (fLwbp1 === false || fLwbp2 === false || fWbp === false || fTotal === false || fKvarh === false) {
                isValid = false; namaPenyulangEror = pName;
            }

            rowsData.push({ gi: giVal, trafo: trafoVal, penyulang: pName, lwbp1: fLwbp1, lwbp2: fLwbp2, wbp: fWbp, total: fTotal, kvarh: fKvarh });
        });

        if (rowsData.length === 0) {
            alert("Pemberitahuan: Tidak ada data yang dikirim karena semua kolom input kosong.");
            submitBtn.disabled = false; submitBtn.innerHTML = 'Simpan Data'; return;
        }
        if (!isValid) {
            alert(`Pemberitahuan: Format salah pada penyulang "${namaPenyulangEror}".`);
            submitBtn.disabled = false; submitBtn.innerHTML = 'Simpan Data'; return;
        }

        fetch(scriptURL, { method: 'POST', body: JSON.stringify({ rows: rowsData }) })
        .then(response => {
            alert(`Sukses! Data ${giVal} ${trafoVal} yang terisi berhasil disimpan.`);
            form.reset(); submitBtn.disabled = false; submitBtn.innerHTML = 'Simpan Data';
        })
        .catch(error => {
            alert('Gagal menyimpan, mohon periksa koneksi internet.');
            submitBtn.disabled = false; submitBtn.innerHTML = 'Simpan Data';
        });
    });

    // TAB 2: MONITORING ENGINE (17 KOTAK GI + 3 STATUS DINAMIS + DETAIL PENYULANG)
    function muatHalamanMonitoring() {
        loadingMonitor.style.display = 'block';
        gridContainer.innerHTML = "";
        progressLabel.innerHTML = "Memproses penyaringan status harian...";
        progressBar.style.width = '0%';

        fetch(scriptURL)
            .then(response => response.json())
            .then(resData => {
                loadingMonitor.style.display = 'none';
                const sudahInputList = resData.sudahInput || [];
                
                let totalGI = 0;
                let lengkapGI = 0;

                // Loop 17 Gardu Induk dari dbSistem
                Object.keys(dbSistem).forEach(giName => {
                    totalGI++;
                    let totalPenyulangGI = 0;
                    let suksesPenyulangGI = 0;
                    let htmlDetail = "";

                    // Hitung total penyulang & penyulang yang sudah diisi pada GI ini
                    Object.keys(dbSistem[giName]).forEach(tId => {
                        dbSistem[giName][tId].forEach(pName => {
                            totalPenyulangGI++;
                            const keyCheck = `${giName}|TRAFO ${tId}|${pName}`;
                            const isDone = sudahInputList.includes(keyCheck);
                            
                            if (isDone) suksesPenyulangGI++;

                            htmlDetail += `
                                <div style="display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px solid #334155; font-size:12px;">
                                    <span style="color:#cbd5e1;">T.${tId} - ${pName}</span>
                                    <span style="color:${isDone ? '#10b981' : '#ef4444'}; font-weight:bold;">
                                        ${isDone ? '🟢 OK' : '🔴 BELUM'}
                                    </span>
                                </div>
                            `;
                        });
                    });

                    // Tentukan 3 Kondisi Status Cerdas
                    let badgeClass = 'status-wait';
                    let badgeText = '🔴 Belum Input';

                    if (suksesPenyulangGI === totalPenyulangGI && totalPenyulangGI > 0) {
                        badgeClass = 'status-done';
                        badgeText = '🟢 Lengkap';
                        lengkapGI++;
                    } else if (suksesPenyulangGI > 0) {
                        badgeClass = 'status-partial';
                        badgeText = `🟡 Dicicil (${suksesPenyulangGI}/${totalPenyulangGI})`;
                    }

                    const card = document.createElement('div');
                    card.className = 'gi-card';
                    card.style.cursor = 'pointer';
                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div class="gi-name">${giName}</div>
                            <span style="font-size:11px; color:var(--text-muted);">▼ Rincian</span>
                        </div>
                        <div class="status-badge ${badgeClass}" style="margin-top:6px;">${badgeText}</div>
                        <div class="detail-box" style="display:none; margin-top:12px; padding-top:8px; border-top:1px dashed var(--border); max-height:180px; overflow-y:auto;">
                            ${htmlDetail}
                        </div>
                    `;

                    // Fitur klik kotak GI untuk melihat penyulang mana yang masih merah/belum
                    card.addEventListener('click', (e) => {
                        if (e.target.closest('.detail-box')) return;
                        const box = card.querySelector('.detail-box');
                        box.style.display = (box.style.display === 'none') ? 'block' : 'none';
                    });

                    gridContainer.appendChild(card);
                });

                // Update Progress Bar berdasarkan GI yang sudah 100% Lengkap
                const persentase = totalGI > 0 ? Math.round((lengkapGI / totalGI) * 100) : 0;
                progressBar.style.width = persentase + '%';
                progressLabel.innerHTML = `Progres Penyelesaian Hari Ini: <b>${lengkapGI}</b> dari <b>${totalGI}</b> GI Lengkap (${persentase}%)`;
            })
            .catch(error => {
                loadingMonitor.innerHTML = "Gagal memuat database status harian.";
                console.error('Error!', error.message);
            });
    }
</script>
</body>
</html>
