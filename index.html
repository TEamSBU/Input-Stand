<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Energi Penyulang - GI Kenjeran</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --input-bg: #0f172a;
            --success: #10b981;
            --success-hover: #059669;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; 
        }

        body { 
            background-color: var(--bg-main); 
            color: var(--text-main);
            padding: 20px 15px; 
            display: flex; 
            justify-content: center; 
        }

        .container { 
            background-color: var(--bg-card); 
            padding: 30px 25px; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3), 0 8px 10px -6px rgba(0,0,0,0.3); 
            width: 100%; 
            max-width: 1150px; 
        }

        .header-section {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        h2 { 
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 8px; 
            color: var(--text-main); 
        }

        p.subtitle { 
            color: var(--text-muted); 
            font-size: 14px; 
        }

        .filter-section { 
            background-color: rgba(15, 23, 42, 0.6); 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 25px; 
            border: 1px solid var(--border); 
            display: flex; 
            gap: 20px; 
            align-items: center; 
        }

        .filter-group { 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
            width: 100%; 
            max-width: 280px; 
        }

        .filter-group label { 
            font-size: 12px; 
            font-weight: 700; 
            color: var(--text-muted); 
            letter-spacing: 0.05em;
        }

        .select-custom { 
            padding: 12px; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            font-size: 14px; 
            outline: none; 
            background-color: var(--input-bg); 
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .select-custom:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }
        
        .select-custom:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .table-wrapper { 
            overflow-x: auto; 
            margin-bottom: 30px; 
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 13px; 
            min-width: 850px; 
            background-color: rgba(15, 23, 42, 0.3);
        }

        th, td { 
            padding: 12px 14px; 
            text-align: left; 
            border-bottom: 1px solid var(--border);
        }

        th { 
            background-color: #1e293b; 
            color: var(--text-muted); 
            font-weight: 600; 
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.05em;
            border-bottom: 2px solid var(--border);
        }

        tbody tr {
            transition: background-color 0.15s;
        }

        tbody tr:hover {
            background-color: rgba(51, 65, 85, 0.3);
        }

        td b {
            color: #f1f5f9;
            font-weight: 600;
        }
        
        .input-num { 
            width: 100%; 
            padding: 10px 12px; 
            border: 1px solid var(--border); 
            border-radius: 6px; 
            font-size: 14px; 
            text-align: right; 
            outline: none; 
            background-color: var(--input-bg);
            color: var(--text-main);
            transition: all 0.2s;
        }

        .input-num:focus { 
            border-color: var(--primary); 
            background-color: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        
        .input-num::placeholder {
            color: #475569;
        }

        .btn-container { 
            text-align: right; 
        }

        .btn-submit { 
            padding: 14px 40px; 
            background-color: var(--success); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.2s; 
            width: 100%; 
            max-width: 280px; 
            box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2);
        }

        .btn-submit:hover { 
            background-color: var(--success-hover); 
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled { 
            background-color: #475569; 
            color: #94a3b8;
            cursor: not-allowed; 
            transform: none;
            box-shadow: none;
        }

        @media (max-width: 640px) {
            .filter-section {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .filter-group {
                max-width: 100%;
            }
            .btn-submit {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h2>Penyulang GI Kenjeran Dashboard</h2>
        <p class="subtitle">Pilih Trafo operasional, lengkapi semua parameter entri stand secara manual, lalu simpan.</p>
    </div>
    
    <div class="filter-section">
        <div class="filter-group">
            <label>GARDU INDUK</label>
            <select class="select-custom" disabled>
                <option>KENJERAN</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="trafoSelect">PILIH TRAFO METER</label>
            <select id="trafoSelect" class="select-custom">
                <option value="I">TRAFO I</option>
                <option value="II">TRAFO II</option>
                <option value="III">TRAFO III</option>
            </select>
        </div>
    </div>

    <form id="matrixForm">
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Nama Penyulang</th>
                        <th style="width: 125px;">LWBP 1</th>
                        <th style="width: 125px;">LWBP 2</th>
                        <th style="width: 125px;">WBP</th>
                        <th style="width: 135px;">TOTAL</th>
                        <th style="width: 125px;">kVarh</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
        
        <div class="btn-container">
            <button type="submit" id="submitBtn" class="btn-submit">Simpan Data Trafo</button>
        </div>
    </form>
</div>

<script>
    const penyulangMaster = {
        "I": ["Meter Utama", "Meter Pembanding", "PS", "Kalijudan", "Babatan", "Tmbk Sari", "Kr. Asem", "Resman", "Putro Agung", "Kp. Krampung", "Ked. Cowek", "Tb. Deres"],
        "II": ["Meter Utama", "Meter Pembanding", "PS", "Mojoarum", "Dh. Husada", "Rangkah", "Tuwowo", "Kaliondo", "Mulyosari", "Sidoyoso", "Kapas Jaya", "Wiratno"],
        "III": ["Meter Utama", "Meter Pembanding", "PS", "Pogot", "Bogen", "Gersikan", "Wisma Permai", "AURI", "Tampurejo", "Platuk"]
    };

    const trafoSelect = document.getElementById('trafoSelect');
    const tbody = document.getElementById('tableBody');

    function renderPenyulang(trafoId) {
        tbody.innerHTML = ""; 
        const listPenyulang = penyulangMaster[trafoId];
        
        listPenyulang.forEach(pName => {
            const tr = document.createElement('tr');
            tr.setAttribute('data-pname', pName);
            tr.innerHTML = `
                <td><b>${pName}</b></td>
                <td><input type="number" step="any" class="input-num lwbp1" required min="0" placeholder="0"></td>
                <td><input type="number" step="any" class="input-num lwbp2" required min="0" placeholder="0"></td>
                <td><input type="number" step="any" class="input-num wbp" required min="0" placeholder="0"></td>
                <td><input type="number" step="any" class="input-num total" required min="0" placeholder="0"></td>
                <td><input type="number" step="any" class="input-num kvarh" required min="0" placeholder="0"></td>
            `;
            tbody.appendChild(tr);
        });
    }

    renderPenyulang(trafoSelect.value);

    trafoSelect.addEventListener('change', (e) => {
        renderPenyulang(e.target.value);
    });

    // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwAKdHfAVeKeFEEIWWJtMO93TP3U048xplV0fU8mDYG_QR6LaC4ENaZmXUZDjylpz4N/exec';
    const form = document.getElementById('matrixForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', e => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Menyimpan...';

        const selectedTrafo = trafoSelect.value;
        const rowsData = [];
        const allRows = tbody.querySelectorAll('tr');
        
        allRows.forEach(tr => {
            rowsData.push({
                gi: 'KENJERAN',
                trafo: `TRAFO ${selectedTrafo}`,
                penyulang: tr.getAttribute('data-pname'),
                lwbp1: tr.querySelector('.lwbp1').value,
                lwbp2: tr.querySelector('.lwbp2').value,
                wbp: tr.querySelector('.wbp').value,
                total: tr.querySelector('.total').value,
                kvarh: tr.querySelector('.kvarh').value
            });
        });

        fetch(scriptURL, { 
            method: 'POST', 
            body: JSON.stringify({ rows: rowsData })
        })
        .then(response => {
            alert(`Sukses! Data Parameter TRAFO ${selectedTrafo} berhasil disimpan.`);
            form.reset();
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Simpan Data Trafo';
        })
        .catch(error => {
            alert('Gagal menyimpan, mohon periksa koneksi internet.');
            console.error('Error!', error.message);
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'Simpan Data Trafo';
        });
    });
</script>

</body>
</html>
