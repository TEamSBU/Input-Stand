<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input kWh Penyulang - GI Kenjeran</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f7f6; padding: 30px; display: flex; justify-content: center; }
        .container { background-color: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); width: 100%; max-width: 800px; }
        h2 { text-align: center; margin-bottom: 5px; color: #333; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 25px; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #007bff; color: white; font-weight: 600; text-align: center; }
        .text-center { text-align: center; }
        .bg-light { background-color: #f9f9f9; font-weight: bold; color: #444; }
        .input-kwh { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; text-align: right; outline: none; }
        .input-kwh:focus { border-color: #007bff; background-color: #fffdf0; box-shadow: 0 0 4px rgba(0,123,255,0.2); }
        .btn-container { text-align: right; }
        .btn-submit { padding: 12px 30px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { background-color: #218838; }
        .btn-submit:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h2>Form Input kWh Penyulang</h2>
    <p class="subtitle">Silakan isi angka kWh pada kolom paling kanan, lalu klik Simpan Data.</p>
    
    <form id="kwhForm">
        <table>
            <thead>
                <tr>
                    <th style="width: 5px;">NO</th>
                    <th>GARDU INDUK</th>
                    <th style="width: 80px;">TRAFO</th>
                    <th>NAMA PENYULANG</th>
                    <th style="width: 200px;">KWH PENYULANG</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="text-center" rowspan="9">1</td>
                    <td class="bg-light" rowspan="9">KENJERAN</td>
                    <td class="text-center bg-light" rowspan="9">I</td>
                    <td>KALIJUDAN</td>
                    <td><input type="number" class="input-kwh" name="KALIJUDAN" placeholder="0" required min="0"></td>
                </tr>
                <tr>
                    <td>BABATAN</td>
                    <td><input type="number" class="input-kwh" name="BABATAN" placeholder="0" required min="0"></td>
                </tr>
                <tr>
                    <td>TMBK SARI</td>
                    <td><input type="number" class="input-kwh" name="TMBK_SARI" placeholder="0" required min="0"></td>
                </tr>
                <tr>
                    <td>KR. ASEM</td>
                    <td><input type="number" class="input-kwh" name="KR_ASEM" placeholder="0" required min="0"></td>
                </tr>
                <tr>
                    <td>RESMAN</td>
                    <td><input type="number" class="input-kwh" name="RESMAN" placeholder="0" required min="0"></td>
                </tr>
                <tr>
                    <td>PUTRO AGUNG</td>
                    <td><input type="number" class="input-kwh" name="PUTRO_AGUNG" placeholder="0" required min="0"></td>
                </tr>
                <tr>
                    <td>KP. KRAMPUNG</td>
                    <td><input type="number" class="input-kwh" name="KP_KRAMPUNG" placeholder="0" required min="0"></td>
                </tr>
                <tr>
                    <td>KED. COWEK</td>
                    <td><input type="number" class="input-kwh" name="KED_COWEK" placeholder="0" required min="0"></td>
                </tr>
                <tr>
                    <td>TB. DERES</td>
                    <td><input type="number" class="input-kwh" name="TB_DERES" placeholder="0" required min="0"></td>
                </tr>
            </tbody>
        </table>
        
        <div class="btn-container">
            <button type="submit" id="submitBtn" class="btn-submit">Simpan Semua Data</button>
        </div>
    </form>
</div>

<script>
    // TEMPELKAN URL WEB APP ANDA DI SINI
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwAKdHfAVeKeFEEIWWJtMO93TP3U048xplV0fU8mDYG_QR6LaC4ENaZmXUZDjylpz4N/exec';
    
    const form = document.getElementById('kwhForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', e => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Menyimpan...';

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                alert('Seluruh data kWh berhasil disimpan!');
                form.reset();
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Simpan Semua Data';
            })
            .catch(error => {
                alert('Gagal menyimpan data. Periksa URL Apps Script Anda.');
                console.error('Error!', error.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Simpan Semua Data';
            });
    });
</script>

</body>
</html>
